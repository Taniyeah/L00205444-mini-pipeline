services:
  app:
    build: .
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: alert_rules
        target: /etc/prometheus/alerts.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml

configs:
  # Prometheus: scrape the app's /metrics page every 5 seconds
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s
      rule_files:
        - /etc/prometheus/alerts.yml
      scrape_configs:
        - job_name: app
          static_configs:
            - targets: ['app:3000']

  # Alert: fires if the app is unreachable for 10 seconds
  alert_rules:
    content: |
      groups:
        - name: app
          rules:
            - alert: AppDown
              expr: up{job="app"} == 0
              for: 10s
              labels:
                severity: critical
              annotations:
                summary: "The app is down"

  # Grafana: connect to Prometheus automatically
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
